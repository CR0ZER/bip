# Release : a chaque tag vX.Y.Z, GitHub compile Bip sur une machine Windows
# (csc du .NET Framework, aucun SDK), fabrique le zip et publie la release.

name: Release

on:
  push:
    tags: ["v*"]

# contents : publier la release ; id-token et attestations : attestation de provenance du zip.
permissions:
  contents: write
  id-token: write
  attestations: write

# Actions epinglees par empreinte de commit (un tag peut etre deplace) ; version en commentaire.
jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Le tag correspond a la version du code
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}".TrimStart('v')
          $code = (Select-String -Path src/Version.cs -Pattern 'Text = "([^"]+)"').Matches[0].Groups[1].Value
          if ($tag -ne $code) { throw "Le tag v$tag ne correspond pas a src/Version.cs ($code)." }

      - name: Compilation
        shell: cmd
        run: build.cmd

      - name: Tests (audit, regles, chainage)
        shell: cmd
        run: tests\run.cmd

      - name: Paquet
        shell: pwsh
        run: |
          $name = "Bip-${{ github.ref_name }}"
          New-Item -ItemType Directory $name | Out-Null
          Copy-Item ClaudeNotch.exe, NotchHook.exe, bip.exe, installer.cmd, desinstaller.cmd, build.cmd, README.md, LICENSE $name
          Copy-Item src $name -Recurse
          Compress-Archive -Path $name -DestinationPath "$name.zip"
          $hash = (Get-FileHash "$name.zip" -Algorithm SHA256).Hash.ToLower()
          Set-Content "$name.zip.sha256" "$hash  $name.zip" -Encoding ascii -NoNewline
          "Empreinte SHA-256 : $hash"

      # Prouve que le zip a ete construit par ce workflow, depuis ce depot :
      # gh attestation verify Bip-vX.Y.Z.zip -R CR0ZER/bip
      - name: Attestation de provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: Bip-${{ github.ref_name }}.zip

      - name: Notes de version (CHANGELOG.md)
        shell: pwsh
        run: |
          $v = "${{ github.ref_name }}".TrimStart('v')
          $lines = Get-Content CHANGELOG.md -Encoding utf8
          $start = [array]::FindIndex($lines, [Predicate[string]]{ param($l) $l -match "^## \[$([regex]::Escape($v))\]" })
          if ($start -lt 0) { throw "Aucune section [$v] dans CHANGELOG.md." }
          $end = [array]::FindIndex($lines, $start + 1, [Predicate[string]]{ param($l) $l -match '^## \[' })
          if ($end -lt 0) { $end = $lines.Count }
          $notes = $lines[($start + 1)..($end - 1)]
          $hash = Get-Content "Bip-${{ github.ref_name }}.zip.sha256"
          $notes += "", "---", "", "SHA-256 : ``$hash``", "", "Provenance : ``gh attestation verify Bip-${{ github.ref_name }}.zip -R CR0ZER/bip``"
          Set-Content notes.md $notes -Encoding utf8

      - name: Publication
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $name = "Bip-${{ github.ref_name }}"
          gh release create "${{ github.ref_name }}" "$name.zip" "$name.zip.sha256" --title "Bip ${{ github.ref_name }}" --notes-file notes.md
