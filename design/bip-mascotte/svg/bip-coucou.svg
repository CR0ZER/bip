<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="256" height="256" role="img" aria-label="Bip fait coucou">
  <!-- Coucou : deux signes du bras, une pause, un clignement d'yeux. Cycle de 3,2 s.
       Animation SVG native (SMIL) : elle tourne aussi dans une balise <img>, sur GitHub. -->
  <g>
    <animateTransform attributeName="transform" type="translate" dur="3.2s" repeatCount="indefinite"
      keyTimes="0;0.08;0.18;0.28;0.38;0.46;1" values="0 0;0 0;0 -0.6;0 0;0 -0.6;0 0;0 0"/>
    <path d="M24 16 L28.5 10.5" fill="none" stroke="#3FD07F" stroke-width="3" stroke-linecap="round">
      <animateTransform attributeName="transform" type="rotate" dur="3.2s" repeatCount="indefinite" calcMode="spline"
        keyTimes="0;0.08;0.18;0.28;0.38;0.46;1"
        values="0 24 16;-16 24 16;12 24 16;-16 24 16;12 24 16;0 24 16;0 24 16"
        keySplines="0.4 0 0.6 1;0.4 0 0.6 1;0.4 0 0.6 1;0.4 0 0.6 1;0.4 0 0.6 1;0 0 1 1"/>
    </path>
    <rect x="7" y="11" width="18" height="14" rx="4" fill="#3FD07F"/>
    <rect x="10" y="24" width="4" height="4" rx="1.2" fill="#3FD07F"/>
    <rect x="18" y="24" width="4" height="4" rx="1.2" fill="#3FD07F"/>
    <path d="M16 11 V6.5" fill="none" stroke="#3FD07F" stroke-width="1.8"/>
    <ellipse cx="16" cy="5" rx="2.2" ry="2.2" fill="#3FD07F"/>
    <g>
      <animate attributeName="opacity" dur="3.2s" repeatCount="indefinite" calcMode="discrete" keyTimes="0;0.74;0.8" values="1;0;1"/>
      <path d="M11 18.8 Q13 15.8 15 18.8" fill="none" stroke="#141414" stroke-width="2.2" stroke-linecap="round"/>
      <path d="M17 18.8 Q19 15.8 21 18.8" fill="none" stroke="#141414" stroke-width="2.2" stroke-linecap="round"/>
    </g>
    <g opacity="0">
      <animate attributeName="opacity" dur="3.2s" repeatCount="indefinite" calcMode="discrete" keyTimes="0;0.74;0.8" values="0;1;0"/>
      <path d="M11 18 Q13 20 15 18" fill="none" stroke="#141414" stroke-width="1.8" stroke-linecap="round"/>
      <path d="M17 18 Q19 20 21 18" fill="none" stroke="#141414" stroke-width="1.8" stroke-linecap="round"/>
    </g>
    <path d="M14.5 21.2 Q16 22.8 17.5 21.2" fill="none" stroke="#141414" stroke-width="1.6" stroke-linecap="round"/>
  </g>
</svg>
